<div class="register-page">
  <div class="register-card">
    <h2 class="register-title">REGISTER</h2>

    <form class="register-form" #registerForm="ngForm" (ngSubmit)="onRegister(registerForm)">
      <input type="text" [(ngModel)]="userData.Username" name="Username" placeholder="Username" class="input-field" required>
      <input type="text" [(ngModel)]="userData.Surname" name="Surname" placeholder="Surname" class="input-field" required>
      <input type="email" [(ngModel)]="userData.Email" name="Email" placeholder="Email" class="input-field" required>
      <input type="password" [(ngModel)]="userData.Password" name="Password" placeholder="Password" class="input-field" required>
      <input type="password" [(ngModel)]="userData.ConfirmPassword" name="ConfirmPassword" placeholder="Confirm Password" class="input-field" required>
      
      <div class="form-actions">
        <input type="submit" class="btn primary-btn" value="Sign Up">
        <button type="button" class="btn secondary-btn" routerLink="/">Back to Login</button>
      </div>
    </form>
  </div> 
</div>
