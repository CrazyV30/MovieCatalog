<div class="register-page">
  <div class="register-card">
    <h2 class="register-title">REGISTER</h2>
    <!-- TODO: correct inputs -->
    <form class="register-form" method="post">
      <input type="text" placeholder="Username" class="input-field" required>
      <input type="text" placeholder="Surname" class="input-field" required>
      <input type="email" placeholder="Email" class="input-field" required>
      <input type="password" placeholder="Password" class="input-field" required>
      <input type="password" placeholder="Confirm Password" class="input-field" required>
      
      <div class="form-actions">
        <button type="submit" class="btn primary-btn">Sign Up</button>
        <button type="button" class="btn secondary-btn" routerLink="/">Back to Login</button>
      </div>
    </form>
  </div>
</div>
