<div class="form-card">
  <h2>Додати новий фільм</h2>
  
  <form #addForm="ngForm" (ngSubmit)="onAddMovie(addForm)" class="movie-form">
    
    <div class="form-group">
      <label for="title">Назва фільму:</label>
      <input 
        id="title" 
        type="text" 
        name="title" 
        [(ngModel)]="movieData.Title" 
        placeholder="Введіть назву фільму"
        required>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="director">Режисер:</label>
        <input 
          id="director" 
          type="text" 
          name="director" 
          [(ngModel)]="movieData.Director" 
          placeholder="Ім'я режисера"
          required>
      </div>
      <div class="form-group">
        <label for="year">Рік випуску:</label>
        <input 
          id="year" type="number" name="ReleaseYear" min="1900"
          [(ngModel)]="movieData.ReleaseYear" 
          placeholder="наприклад, 2024" 
          required>
      </div>
      <div class="form-group">
        <label for="runtime">Тривалість:</label>
        <input 
          id="runtime" 
          type="text" 
          name="runtime" 
          [(ngModel)]="movieData.Runtime" 
          placeholder="наприклад, 1:25" 
          required>
      </div>
    </div>

    <div class="form-group">
      <label for="photoPath">Посилання на постер:</label>
      <input 
        id="photoPath" 
        type="url" 
        name="photoPath" 
        [(ngModel)]="movieData.PhotoPath" 
        placeholder="https://example.com/poster.jpg"
        required>
    </div>
    <div class="form-group">
      <label for="videoPath">Посилання на фільм (videoPath):</label>
      <input 
        id="videoPath" 
        type="url" 
        name="videoPath" 
        [(ngModel)]="movieData.MoviePath" 
        placeholder="https://example.com/watch?v=..." 
        required>
    </div>
    <div class="form-group">
      <label for="description">Опис фільму:</label>
      <textarea 
        id="description" 
        name="description" 
        rows="5" 
        [(ngModel)]="movieData.Description" 
        placeholder="Короткий опис сюжену..."
        required></textarea>
    </div>

    <div class="form-actions">
      <button type="button" class="btn btn-secondary" (click)="cancel()">
        Скасувати
      </button>
      <button type="submit" class="btn btn-primary" [disabled]="addForm.invalid">
        Створити фільм
      </button>
    </div>

  </form>
</div>
