<div class="auth-card">
  <h2>Вхід в систему</h2>
  
  <form #loginForm="ngForm" (ngSubmit)="onLogin(loginForm)" class="auth-form">
    <div class="form-group">
      <label for="username">Логін / Email:</label>
      <input 
        id="username" 
        type="text" 
        name="email" 
        [(ngModel)]="userLogin.Email" 
        required>
    </div>

    <div class="form-group">
      <label for="password">Пароль:</label>
      <input 
        id="password" 
        type="password" 
        name="password" 
        [(ngModel)]="userLogin.Password" 
        required>
    </div>

    <button type="submit" class="btn btn-primary btn-full" [disabled]="loginForm.invalid">
      Увійти
    </button>
  </form>

  <div class="auth-footer">
    <span>Ще не маєте акаунту?</span>
    <a (click)="toRegister()" class="auth-link">Зареєструватися</a>
  </div>
</div>
