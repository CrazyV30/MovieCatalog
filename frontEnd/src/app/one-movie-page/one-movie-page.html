<div class="movie-details-container">

  <div class="movie-details-card">
    <!-- Постер фільму -->
    <div class="poster-container">
      <img [src]="movie()?.photoPath" [alt]="movie()?.title" class="movie-poster">
    </div>

    <!-- Інформація про фільм -->
    <div class="movie-info">
      <div class="header-actions">
        <h1 class="movie-title">{{ movie()?.title }}</h1>
        <!-- Кнопка редагування -->
        @if (authService.currentUser()) {
          <div class="action-buttons">
            <button type="button" class="btn btn-primary" (click)="edit(movie()!.id)">
              Редагувати
            </button>
          </div>
        }
      </div>

      <div class="meta-data">
        <span class="badge">Рік: {{ movie()?.releaseYear }}</span>
        <span class="badge">Тривалість: {{ movie()?.runtime }}</span>
        <span class="director">Режисер: <strong>{{ movie()?.director }}</strong></span>
      </div>

      <div class="description-section">
        <h3>Опис фільму</h3>
        <p class="movie-description">{{ movie()?.description }}</p>
      </div>
    </div>
  </div>
</div>
