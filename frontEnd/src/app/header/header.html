<header class="main-header">
  <div class="header-container">
    <a routerLink="/" class="logo">
      🎬 <span>MovieCatalog</span>
    </a>

    <nav class="nav-links">
      <a routerLink="/" routerLinkActive="active">Каталог</a>
      @if (authService.currentUser(); as user) {
        <a routerLink="/addMovie" routerLinkActive="active">Додати фільм</a>
      }
    </nav>
    <form class="search-bar" (ngSubmit)="onSearch()">
      <div class="select-wrapper">
        <select [(ngModel)]="selectedCategory" name="category" class="category-select" aria-label="Категорія пошуку">
          <option value="title" selected>Назва</option>
          <option value="genre">Жанр</option>
          <option value="year">Рік випуску</option>
          <option value="country">Країна</option>
          <option value="keyword">Ключове слово</option>
        </select>
      </div>

      <input 
        type="text" 
        [(ngModel)]="searchQuery" 
        name="query"
        [placeholder]="getPlaceholder()" 
        class="search-input"
      />

      <button type="submit" class="search-btn" aria-label="Пошук">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>
    </form>
    <div class="auth-actions">
      @if (authService.currentUser(); as user) {
        <span class="user-name">👤 {{ user.username }}</span>
        <button type="button" class="btn btn-logout" (click)="authService.logout()">
          Вийти
        </button>
      } @else {
        <a routerLink="/login" class="btn btn-login">Увійти</a>
        <a routerLink="/register" class="btn btn-register">Реєстрація</a>
      }
    </div>
  </div>
</header>
