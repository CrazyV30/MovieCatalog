<div class="form-card">
  <h2>Редагування фільму</h2>
  
  <form #movieForm="ngForm" (ngSubmit)="onSubmit(movieForm)" class="movie-form">
    
    <input type="hidden" name="Id" [value]="movie()?.id" [(ngModel)]="movie()!.id">

    <!-- Назва -->
    <div class="form-group">
      <label for="title">Назва фільму:</label>
      <input 
        id="title" type="text" name="Title" 
        [value]="movie()?.title"
        [(ngModel)]="movie()!.title" 
        required #titleInput="ngModel">
    </div>

    <div class="form-row">
      <!-- Режисер -->
      <div class="form-group">
        <label for="director">Режисер:</label>
        <input 
          id="director" type="text" name="Director" 
          [value]="movie()?.director"
          [(ngModel)]="movie()!.director" required>
      </div>
      <div class="form-group">
        <label for="year">Рік випуску:</label>
        <input 
          id="year" type="number" name="ReleaseYear" min="1900" [value]="movie()?.releaseYear"
          [(ngModel)]="movie()!.releaseYear" 
          placeholder="наприклад, 2024" 
          required>
      </div>
      <!-- Тривалість -->
      <div class="form-group">
        <label for="runtime">Тривалість:</label>
        <input 
          id="runtime" type="text" name="Runtime" 
          [value]="movie()?.runtime"
          [(ngModel)]="movie()!.runtime" 
          placeholder="наприклад, 1:20" 
          
          required>
      </div>
    </div>

    <!-- Посилання на постер (photoPath) -->
    <div class="form-group">
      <label for="photoPath">Посилання на постер:</label>
      <input 
        id="photoPath" type="url" name="PhotoPath" 
        [value]="movie()?.photoPath"
        [(ngModel)]="movie()!.photoPath" 
        required>
    </div>
    <div class="form-group">
      <label for="videoPath">Посилання на фільм:</label>
      <input 
        id="videoPath" type="url" name="MoviePath" [value]="movie()?.moviePath"
        [(ngModel)]="movie()!.moviePath" 
        placeholder="https://example.com/watch?v=..." 
        required>
    </div>
    <!-- Опис -->
    <div class="form-group">
      <label for="description">Опис фільму:</label>
      <textarea 
        id="description" name="Description" rows="6" 
        [value]="movie()?.description"
        [(ngModel)]="movie()!.description" 
        required></textarea>
    </div>

    <!-- Дії -->
    <div class="form-actions">
      <button type="button" class="btn btn-secondary" (click)="cancel()">
        Скасувати
      </button>
      <button type="submit" class="btn btn-primary" [disabled]="movieForm.invalid">
        Зберегти зміни
      </button>
    </div>

  </form>
</div>
