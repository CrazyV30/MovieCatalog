<div class="catalog-container">
  <!-- Верхня панель дій -->
  <div class="catalog-header">
    <h2>Каталог фільмів</h2>
    <button type="button" class="btn btn-primary" (click)="onAddMovie()">+ Додати фільм</button>
    <button type="button" class="btn btn-primary" (click)="logout()">Вийти</button>
  </div>

  <!-- Сітка фільмів -->
  <div class="movies-grid">
    @for (movie of movies(); track movie.id) {
      <div class="movie-card" (click)="viewMovieDetails(movie.id)">
        <button type="button" class="btn-delete-icon" title="Видалити фільм" (click)="removeMovie(movie.id)">✕</button>
        <div class="card-poster">
          <img [src]="movie.photoPath" [alt]="movie.title" loading="lazy">
        </div>
        <div class="card-content">
          <h3 class="card-title">{{ movie.title }}</h3>
          <p class="card-meta">
            <span>{{ movie.runtime }}</span> • <span>{{ movie.director }}</span>
          </p>
          <p class="card-description">{{ movie.description }}</p>
          
        </div>
      </div>
    } @empty {
      <div class="empty-state">
        <p>Фільмів поки немає в каталозі.</p>
      </div>
    }
  </div>
</div>
