<div class="catalog-page">
  <div class="catalog-container">
    
    <div class="catalog-header">
      <button class="btn add-btn" (click)="onAddMovie()">Add Film</button>
      <button class="btn add-btn" (click)="logout()">Log out</button>
    </div>
    
    <div class="film-grid">
      @for (movie of movies(); track $index) {
        <div class="film-card">
          <div class="film-poster-container">
            <img [src]="movie.photoPath" [alt]="'Постер ' + movie.title" class="film-poster-img" />
          </div>
          
          <div class="film-details">
            <h3 class="film-title">{{ movie.title }}</h3>
            
            <div class="film-meta">
              <span class="meta-item"><strong>Director:</strong> {{ movie.director }}</span>
              <span class="meta-item"><strong>Runtime:</strong> {{ movie.runtime }}</span>
            </div>
            
            <input type="hidden" [value]="movie.id" />
            <p class="film-description">{{ movie.description }}</p>
          </div>
          <div class="film-actions">
            <button class="remove-btn" (click)="removeMovie(movie.id)">Remove &#10005;</button>
          </div>
        </div>
      }      
    </div>
  </div>
</div>
